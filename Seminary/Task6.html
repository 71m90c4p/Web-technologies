<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title> Таймер и модальное окно</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .timer-card {
            background-color: #1a1b2e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 320px;
        }
        .timer-title {
            color: #7a7c9d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .clock-display {
            background-color: #0d0d1a;
            color: #00ff00;
            font-size: 42px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            border: 1px solid #2a2a40;
        }
        .btn-set-timer {
            width: 100%;
            padding: 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-set-timer:hover {
            background-color: #2563eb;
        }
        .countdown-display {
            display: none;
            width: 100%;
            padding: 15px;
            background-color: #e63946;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            box-sizing: border-box;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background-color: #1a1b2e;
            padding: 30px;
            border-radius: 20px;
            width: 300px;
            position: relative;
            text-align: center;
            border: 1px solid #2a2a40;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #2a2a40;
            color: #7a7c9d;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .close-btn:hover {
            color: white;
        }
        .modal-title {
            color: #00ff00;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .modal-label {
            display: block;
            color: #7a7c9d;
            text-align: left;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .seconds-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background-color: #0d0d1a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            color: #00ff00;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }
        .seconds-input::-webkit-outer-spin-button,
        .seconds-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .btn-start {
            width: 100%;
            padding: 15px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }
        .btn-start:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>
    <div class="timer-card">
        <div class="timer-title">Текущее время</div>
        <div class="clock-display" id="clock">00:00:00</div>
        <button class="btn-set-timer" id="open-modal-btn">Установить таймер</button>
        <div class="countdown-display" id="countdown-display">00:00:00</div>
    </div>
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal-content">
                <button class="close-btn" id="close-modal-btn">X</button>
                <h2 class="modal-title">Установить таймер</h2>
                <label class="modal-label" for="seconds-input">Кол-во секунд</label>
                <input
                       type="number"
                       id="seconds-input"
                       class="seconds-input"
                       placeholder="60"
                       min="0"
                       max="9999"
                       />
                <button class="btn-start" id="start-timer-btn">Старт</button>
            </div>
        </div> 
        <script src="Script1.js"></script>

</body>
</html>
