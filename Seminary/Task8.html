<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Котировки Мосбиржи</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background-color: #f4f7fc;
            color: #1e293b;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dashboard-container {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            align-items: flex-start;
        }
        .companies-panel {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .companies-panel h2 {
            font-size: 16px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
        }
        .company-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .company-btn:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }
        .company-btn.active {
            background-color: #eff6ff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .company-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background-color: #3b82f6;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }
        .company-info {
            display: flex;
            flex-direction: column;
        }
        .company-name {
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
        }
        .company-cap {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
        }
        .chart-panel {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            flex: 1;
            position: relative;
            height: 500px;
        }
        .chart-panel h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #1e293b;
        }
        .chart-box {
            width: 100%;
            height: calc(100% - 40px);
            position: relative;
        }
        .error-message {
            color: #ef4444;
            text-align: center;
            margin-top: 50px;
        }
        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }
            .companies-panel {
                width: 100%;
            }
            .chart-panel {
                width: 100%;
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <h1>Котировки Мосбиржи</h1>
    <div class="dashboard-container">
        <aside class="companies-panel">
            <h2>Компании</h2>
            <div id="companies-list">
            </div>
        </aside>
        <main class="chart-panel">
            <h2 id="chart-title">Выберите компанию</h2>
            <div class="chart-box">
                <canvas id="stockChart"></canvas>
            </div>
        </main>
    </div>
    <script src="Script8.js"></script>
</body>
</html>
